# MOSS i2i cache for the colorize task — ColorizeCacheRequest fields.
#
#   make i2i-stage TASK=colorize                   # mangafy the colour corpus into staging/
#   make i2i-preprocess TASK=colorize MODEL=moss   # this file → scripts/moss/colorize_cache.py
#
# Each staged B&W page is the condition: through the TE's vision tower ahead of the
# caption, and VAE-encoded at 1/ref_scale as {stem}.moss_ref; its colour original
# under post_image_dataset/resized is the target. The OCR'd page lines ride the
# caption as layout text items (library/moss/colorize.py).

out = "post_image_dataset/moss/i2i_colorize"
n = 1667                # illustration pairs
manga = 1667            # manga_color pages (0 when manga_dir holds none)
holdout = 8
manga_holdout = 4
resolution = 1024
ref_scale = 2
variants = 4
tag_dropout = 0.8
text_encoder = "fp8"
