dataset_config = "configs/datasets/easycontrol.toml"

network_module = "networks.methods.easycontrol"

network_dim = 16
network_alpha = 16

train_adaln = false
adaln_rank = 8

network_args = [
    "b_cond_init=-10.0",
    "cond_scale=1.0",
    "apply_ffn_lora=1",
]

output_name = "anima_easycontrol"

learning_rate = 1e-4
max_train_epochs = 12
save_every_n_epochs = 12
checkpointing_epochs = 12

use_easycontrol = true
cache_llm_adapter_outputs = true
easycontrol_drop_p = 0.1
caption_dropout_rate = 0.2
easycontrol_cond_noise_max = 0.0

blocks_to_swap = 0

use_cmmd = false

[variant]
family = "easycontrol"
label = "EasyControl (ref == target)"
description = "Extended self-attention image conditioning (the condition is the reference image itself)."
order = 10
