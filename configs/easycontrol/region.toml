name = "region"

# Staged by easycontrol_adapters/region/prep.py: solo-1girl + 1girl1boy
# selection → SAM3 masks (girl / girl-minus-boy, boy, face; low threshold) →
# gated + augmented paint cond tree + flat/positioned caption variants. Keys
# here become prep.py CLI flags (lists spread as-is, bools as bare flags).
[staging]
pairs = true            # 1girl1boy slice: girl painted, boy visible (one-figure paint)
face = true             # SAM head pass (level "face" = paint the head — face + hair — only, body visible)
threshold = 0.4
min_coverage = 0.03
max_coverage = 0.85
min_dominance = 0.75
max_hole_frac = 0.05
pair_max_hole_frac = 0.25   # girl-minus-boy carves real holes where they overlap
max_raggedness = 20.0
min_partner_visible = 0.5   # pairs: ≥50% of the boy must stay outside the paint
min_face_frac = 0.004       # face level needs a face ≥0.4% of the image (else → slack)
# v3: paint over the REAL image (character-inpaint framing — fill the paint
# with the character, reproduce the scene). Mid-gray 128 follows the inpaint
# adapter's convention (~0 in [-1,1]); black collides with legitimately-dark
# art now that the background is real. (v1/v2 white-canvas era used black.)
cond_background = "image"
paint_color = [128, 128, 128]
# Augment levels: exact / smooth / blob / wobble / slack / face. v4 (tight
# supersets only, [0.25 0.35 0.30 0.10]) filled every paint edge-to-edge with
# character (bench area_ratio ≈ iou); "slack" (oversized, off-center paint with
# the real background as target under the rest) is the harmonize lever,
# "face" the concentrate lever.
aug_weights = [0.15, 0.20, 0.15, 0.10, 0.25, 0.15]
slack_grow = [1.5, 3.0]     # slack paint area target, × the character bbox (grows toward free sides)
max_slack_coverage = 0.7    # slack paint may cover ≤70% of the image; no room → a tight level
sam_batch_size = 4

[preprocess]
batch_size = 4
chunk_size = 64
text_batch_size = 16

[training]
network_dim = 32
network_alpha = 128
# b_cond_init back to the family's -4: with the real-image background the cond
# is pixel-dense (the -2 bootstrap was a white-canvas-era fix for the sparse
# position-only signal — see bench 20260823-1156-v1 for the -4 failure there).
network_args = [
    "b_cond_init=-4.0",
    "cond_scale=1.0",
    "apply_ffn_lora=1",
    "cond_res_scale=1.0",
]
masked_loss = false
# bg2 = v3/v4 real-background tight-superset era; v5 adds pairs + slack + face.
output_name = "anima_easycontrol_region_v5"
cond_diff_loss = true

learning_rate = 5e-5
max_train_epochs = 8
save_every_n_epochs = 4
checkpointing_epochs = 4

# Cond dropout doubles as unconditional capability — the paint cue is the whole
# task, but a 5% blind slice keeps the text pathway honest.
easycontrol_drop_p = 0.05
easycontrol_cond_noise_max = 0.01

caption_dropout_rate = 0.1
use_shuffled_caption_variants = true
blocks_to_swap = 0

[general]
caption_extension = '.txt'

[[datasets]]
batch_size = 1
validation_split_num = 0
validation_seed = 42

  [[datasets.subsets]]
  image_dir = 'post_image_dataset/easycontrol/{name}/staging'
  cache_dir = 'post_image_dataset/lora'
  cond_cache_dir = 'post_image_dataset/easycontrol/{name}/cond'
  # Flat + positioned caption variants written by the captions stage (the
  # shared LoRA TE cache stays untouched).
  text_cache_dir = 'post_image_dataset/easycontrol/{name}/text'
  recursive = true
  flip_aug = false
  num_repeats = 1

[variant]
family = "easycontrol"
label = "Region (paint-to-character)"
description = "Generate the character inside a painted region of a real scene. Cond = the scene with a solid gray paint region marking where to generate (position/size; pose via silhouette when painted precisely; a loose oversized paint is fine — the scene is continued under the rest of it); the caption steers identity (optionally with an `On the left, <name>` clause), the cond owns the scene. Trained on solo-1girl images (SAM3 mask painted, exact→slack augmentation, plus face-only paints) and 1girl1boy images (girl painted, boy visible). Configured in configs/easycontrol/region.toml (edit the file directly)."
order = 35
