name = "inpaint"

[staging]
min_frac = 0.10
max_frac = 0.40

[preprocess]
batch_size = 4
chunk_size = 64
text_shuffle_variants = 4
text_tag_dropout_rate = 0.8

[training]
network_dim = 32
network_alpha = 32
network_args = [
    "b_cond_init=-6.0",
    "cond_scale=1.0",
    "apply_ffn_lora=1",
]
output_name = "anima_inpaint"
sigmoid_bias = 0
masked_loss = false

learning_rate = 2e-5
max_train_epochs = 4
save_every_n_epochs = 4
checkpointing_epochs = 4

easycontrol_drop_p = 0.0
easycontrol_cond_noise_max = 0.0

caption_dropout_rate = 0.2
use_shuffled_caption_variants = true

blocks_to_swap = 0

[general]
caption_extension = '.txt'

[[datasets]]
batch_size = 1
validation_split_num = 0
validation_seed = 42

  [[datasets.subsets]]
  image_dir = 'post_image_dataset/resized'
  cache_dir = 'post_image_dataset/lora'
  cond_cache_dir = 'post_image_dataset/easycontrol/{name}/cond'
  text_cache_dir = 'post_image_dataset/easycontrol/{name}/text'
  recursive = true
  flip_aug = false
  num_repeats = 1

[variant]
family = "easycontrol"
label = "Inpaint (masked-region regeneration)"
description = "Regenerate a gray-masked region consistent with the surrounding pixels and the caption. Cond = the original image with a free-form gray hole; the full caption (shuffled + tag-dropped) steers the fill. Empty prompt → context-only fill; a caption steers it. Configured in configs/easycontrol/inpaint.toml (edit the file directly)."
order = 30
