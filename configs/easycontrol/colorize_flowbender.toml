# Colorize + FlowBender — closed-loop feedback-aware colorize (arXiv:2606.20404).
#
# Same EasyControl colorize task as colorize.toml, plus FlowBender's per-step
# look-ahead: each training step re-extracts the manga condition from the model's
# own clean estimate (H = mangafy(decode(x̂₁))) and feeds it back as a THIRD
# cond-token stream, so the model learns a correction policy over its own
# condition-alignment error (the 17.8× drift Phase 0 found — bench/flowbender).
#
# A/B against plain colorize FT (configs/easycontrol/colorize.toml). This file
# keeps `name = "colorize"` so it REUSES colorize's staged cond/text caches and
# the shared color-target latents — no re-staging needed; only output_name +
# the flowbender network_args differ. Run (after the colorize staging/preprocess
# from colorize.toml has already run once):
#   make easycontrol EASYADAPTER=colorize_flowbender
#
# Preconditions enforced at runtime (EasyControlMethodAdapter.on_network_built):
#   - blocks_to_swap = 0  (the look-ahead is a 2nd DiT forward/step; the offloader
#     desyncs on it — see project_blockswap_extra_forwards_gradcache)
# torch_compile IS supported: the three-stream feedback inner is compiled with its
# own dynamic_seq mark prologue (compile_cond_stream / _make_patched_block_forward).

name = "colorize"

# Cond-synthesis + caching knobs are inherited from colorize's staged trees
# (this descriptor reuses them via name="colorize"); kept here for self-contained
# re-staging parity with colorize.toml.
[staging]
engine = "gpu"
only_data_includes = ["comic", "white border", "thick border", "2koma", "multiple views", "speech bubble"]
exclude_data_includes = ["monochrome", "greyscale"]

[preprocess]
text_shuffle_variants = 4
text_tag_dropout_rate = 0.8
text_keep_copyright = true
text_keep_comic = true

[training]
network_dim = 32
network_alpha = 128
target_res = [896, 1024]
network_args = [        # Do not use whitespace in each arg
    "b_cond_init=-4.0",
    "cond_scale=1.0",
    "apply_ffn_lora=1",
    "cond_res_scale=1.0",
    "use_repa=true",            # conditioning-consistency ⟂ representation align;
    "repa_weight=0.05",         # keep REPA on, report the interaction
    "repa_layer=8",
    "repa_target_dog=true",
    # --- FlowBender ---
    "use_flowbender=true",      # grow the feedback cond-LoRA pool + b_feedback gate
    "b_feedback_init=-10.0",    # large negative → step-0 ≈ plain EasyControl colorize
    "flowbender_p_un=0.1"       # null-feedback dropout (paper's p_un); keeps the
                                # unguided look-ahead reliable
]
blocks_to_swap = 0              # REQUIRED by FlowBender (2nd forward/step)
sigmoid_bias = 0
masked_loss=false

learning_rate = 2e-5
max_train_epochs = 4
save_every_n_epochs = 4
checkpointing_epochs = 4

# Manga cond is a lossy hint; keep cond perturbation at zero (high noise erases
# the lineart the feedback must enforce). drop_p=0 → no image-CFG (colorize).
easycontrol_cond_noise_max = 0.0
easycontrol_drop_p = 0.0

caption_dropout_rate = 0.8
use_shuffled_caption_variants = true
use_shuffled_caption_variants_only = true

# === dataset blueprint (identical to colorize.toml; reuses colorize caches) ===
[general]
caption_extension = '.txt'

[[datasets]]
batch_size = 1
validation_split_num=0
validation_seed = 42

  [[datasets.subsets]]
  image_dir = 'post_image_dataset/resized'
  cache_dir = 'post_image_dataset/lora'
  cond_cache_dir = 'post_image_dataset/easycontrol/{name}/cond'
  text_cache_dir = 'post_image_dataset/easycontrol/{name}/text'
  recursive = true
  flip_aug = false
  num_repeats = 1

[variant]
family = "easycontrol"
label = "Colorize + FlowBender (closed-loop)"
description = "Colorize (B&W manga → color) with FlowBender closed-loop feedback: the model consults its own condition-alignment error (mangafy re-extracted from its clean estimate) and learns to bend the trajectory toward the manga tone it was given. A/B vs the plain Colorize descriptor. Configured in configs/easycontrol/colorize_flowbender.toml (edit the file directly)."
order = 21
