# Dual-pool gradient routing — Phase 0 Arm B (rank-matched single r=64 baseline).
# _archive/proposals/turbo_dual_pool_grad_routing.md
#
# Identical to arm_A_dual_32_32.toml in EVERY field except the student layout:
# one r=64 plain-LoRA stack with joint (unrouted) gradients — the shipped
# superturbo student. The merged Arm A checkpoint is also rank 64, so this is the
# fair baseline (project_turbo_tau_split_critic_closed: rank-match the baseline;
# the τ-split "interference" turned out to be an LR artifact, so the first arm
# holds LR fixed too).
output_name = "anima_superturbo_dualpool_B_v1"
dit_path = "models/diffusion_models/anima-base-v1.0.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"

iterations = 750
batch_size = 1
seed = 42
use_masked_loss = true

channel_scaling_alpha = 0.0
compile_dynamic_seq = true
activation_memory_budget = 0.99

base_loss = "dpdmd"

[network]
student_rank = 64             # single pool, joint grads (the shipped student)
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
train_adaln = true
adaln_rank = 16
adaln_alpha = 90

# dual_pool absent = false (byte-identical to the shipped single-pool loop).

student_init_weights = "models/extracted/anima_turboV10_delta_r80_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turboV10_delta_r80_asvd_adaln.safetensors"

[dmd]
dynamic_schedule = true
student_steps = 2
teacher_cfg = 4
dm_x0_norm = true
norm_floor = 0.05
grad_step = "random"

[cdm]
weight = 1.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 200
weight_decay = 0.0
grad_clip = 1.0

[dpdmd]
k_anchor = 6
teacher_anchor_steps = 12
div_weight = 0.1
detach_after_first = true

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.03
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
r1_weight = 100
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[f_distill]
f_div = "rkl"
ratio_lower = 0.1
ratio_upper = 20.0
ratio_ema_rate = 0.0
bin_num = 10
ratio_normalization = true

[io]
save_every = 250
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 250
