# Dual-pool gradient routing — Phase 0 Arm A (dual 32/32).
# _archive/proposals/turbo_dual_pool_grad_routing.md
#
# Derived from configs/gui-methods/custom/superturbo.toml (the CDM + div0.1
# recipe) with EXACTLY ONE change vs Arm B: the student's r=64 is split into two
# always-on plain-LoRA pools —
#   pool B (student_rank=32, warm-started)  ← DMD / GAN / CDM refinement grad
#   pool A (div_pool_rank=32, zero-init)     ← step-0 diversity grad only
# The merged checkpoint is a plain LoRA of rank 32+32 = 64 (exact concat), so the
# fair baseline is arm_B_single_r64.toml (single r=64, joint grads). Warm start,
# GAN, dynamic_schedule, div_weight, seed, data are all held fixed across arms
# (project_turbo_warmstart_scope: never let an objective A/B double as an init A/B).
output_name = "anima_superturbo_dualpool_A_v1"
dit_path = "models/diffusion_models/anima-base-v1.0.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"

iterations = 750               # Phase 0 fine-tune length (ckpt at 250/500/750)
batch_size = 1
seed = 42
use_masked_loss = true

channel_scaling_alpha = 0.0    # channel scaling alpha harmed training (+ inert on pool A by design)
compile_dynamic_seq = true
activation_memory_budget = 0.99

base_loss = "dpdmd"

[network]
# Pool B (quality) — half the shipped rank; scale-preserved (90/32 == 180/64).
student_rank = 32
student_alpha = 90
fake_rank = 64                 # DM regularizer ≥ merged student rank (64)
fake_alpha = 180
attn_mode = "flash"
train_adaln = true             # adaln stays on pool B (quality remap); pool A is plain only
adaln_rank = 16
adaln_alpha = 90

# Dual-pool routing (the one variable under test).
dual_pool = true
div_pool_rank = 32             # pool A: zero-init up, kaiming down, plain attn/MLP only
div_pool_lr = 0.0              # 0 = inherit student_lr (start matched, tune later)

# Pool B warm-starts from the extracted turboV10 delta (same file as Arm B); pool
# A is zero-init and grows a de-collapse correction from zero (don't double the
# warm start — pool A takes NO init file).
student_init_weights = "models/extracted/anima_turboV10_delta_r80_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turboV10_delta_r80_asvd_adaln.safetensors"

[dmd]
dynamic_schedule = true
student_steps = 2
teacher_cfg = 4
dm_x0_norm = true
norm_floor = 0.05
grad_step = "random"

[cdm]
weight = 1.0                   # L_CDM is a refinement-side loss → routes to pool B

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 200
weight_decay = 0.0
grad_clip = 1.0

[dpdmd]
k_anchor = 6
teacher_anchor_steps = 12
div_weight = 0.1               # λ on the first-step diversity MSE (→ pool A)
detach_after_first = true      # REQUIRED by dual_pool — the routing window IS this split backward

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.03              # generator GAN term → pool B
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
r1_weight = 100
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[f_distill]
f_div = "rkl"
ratio_lower = 0.1
ratio_upper = 20.0
ratio_ema_rate = 0.0
bin_num = 10
ratio_normalization = true

[io]
save_every = 250              # ckpt at 250 / 500 / 750
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 250  # cross-seed AC-sim IS the diversity metric — keep ≤250
